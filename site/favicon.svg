<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="x68k-archive">
  <rect width="64" height="64" rx="10" fill="#101018"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="8.5" fill="none" stroke="#2c2c3c" stroke-width="3"/>
  <!-- 3.5 インチフロッピーのシルエット: 本体 + シャッター + ラベル -->
  <rect x="14" y="12" width="36" height="36" rx="3" fill="none" stroke="#e8b04a" stroke-width="3.5"/>
  <!-- シャッター (上部の金属部分) -->
  <rect x="24" y="12" width="16" height="12" fill="#e8b04a"/>
  <rect x="28.5" y="12" width="4" height="12" fill="#101018"/>
  <!-- ラベル面 = 索引済みを示す緑のライン -->
  <rect x="21" y="31" width="22" height="4" rx="1" fill="#6fce8f"/>
  <rect x="21" y="38.5" width="14" height="4" rx="1" fill="#6fce8f" opacity="0.55"/>
</svg>
